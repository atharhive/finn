name: Verify Finn
# Hosted runners are unavailable on this account (Actions billing lock), so the
# suite runs locally and through manual dispatch instead of on every push.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo build -p finn_mcp
      - run: npm run check
      - run: npm run test:rust
      - run: npm run lint:rust
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:vscode
      - run: npm run package -- --target linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: finn-linux-x64
          path: '*.vsix'
          if-no-files-found: error
